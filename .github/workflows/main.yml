name: Telegram 3D Smart Import

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Telegram channel username"
        required: true
        default: "svalkacg"

      message_id:
        description: "Telegram message ID"
        required: true
        default: "3875"

      prefix:
        description: "Archive group prefix"
        required: true
        default: "iCity Cyberpunk"

      max_depth:
        description: "Maximum nested archive depth"
        required: true
        default: "10"

      force_download:
        description: "Ignore existing cache and download again"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: telegram-3d-import
  cancel-in-progress: false

env:
  CHANNEL: ${{ inputs.channel }}
  MESSAGE_ID: ${{ inputs.message_id }}
  ARCHIVE_PREFIX: ${{ inputs.prefix }}
  MAX_ARCHIVE_DEPTH: ${{ inputs.max_depth }}

jobs:

  # ============================================================
  # JOB 1 — DISCOVERY
  # ============================================================

  discover:

    runs-on: ubuntu-latest

    outputs:
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install telethon

      - name: Restore Telegram session
        env:
          TELEGRAM_SESSION_B64: ${{ secrets.TELEGRAM_SESSION_B64 }}
        run: |

          test -n "$TELEGRAM_SESSION_B64"

          mkdir -p secrets

          printf '%s' "$TELEGRAM_SESSION_B64" \
            | base64 -d \
            > secrets/telegram_session.session

          chmod 600 secrets/telegram_session.session

      - name: Discover archive volumes
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}

        run: |

          cat > discover.py <<'PY'

          import os
          import re
          import json
          import asyncio

          from telethon import TelegramClient


          API_ID = int(
              os.environ["TELEGRAM_API_ID"]
          )

          API_HASH = os.environ[
              "TELEGRAM_API_HASH"
          ]

          CHANNEL = os.environ["CHANNEL"]

          MESSAGE_ID = int(
              os.environ["MESSAGE_ID"]
          )

          PREFIX = os.environ[
              "ARCHIVE_PREFIX"
          ]


          def normalize(name):

              name = name.lower()

              name = re.sub(
                  r'\.part\d+\.rar$',
                  '',
                  name,
                  flags=re.I
              )

              name = re.sub(
                  r'\.r\d+$',
                  '',
                  name,
                  flags=re.I
              )

              name = re.sub(
                  r'\.\d{3}$',
                  '',
                  name,
                  flags=re.I
              )

              return name


          def volume_number(name):

              m = re.search(
                  r'\.part(\d+)\.rar$',
                  name,
                  re.I
              )

              if m:
                  return int(m.group(1))

              m = re.search(
                  r'\.r(\d+)$',
                  name,
                  re.I
              )

              if m:
                  return int(m.group(1))

              m = re.search(
                  r'\.(\d{3})$',
                  name,
                  re.I
              )

              if m:
                  return int(m.group(1))

              return 1


          async def main():

              client = TelegramClient(
                  "secrets/telegram_session",
                  API_ID,
                  API_HASH
              )

              await client.start()

              found = {}

              # Search a wider area so multipart volumes
              # posted in nearby messages are discovered.

              start = max(
                  1,
                  MESSAGE_ID - 3000
              )

              end = MESSAGE_ID + 3000

              async for message in client.iter_messages(

                  CHANNEL,

                  min_id=start,

                  max_id=end

              ):

                  if not message.file:
                      continue

                  name = (
                      message.file.name
                      or ""
                  )

                  if not name:
                      continue

                  lower = name.lower()

                  archive = (

                      lower.endswith(".rar")
                      or
                      lower.endswith(".zip")
                      or
                      lower.endswith(".7z")
                      or
                      lower.endswith(".tar")
                      or
                      lower.endswith(".tar.gz")
                      or
                      lower.endswith(".tgz")
                      or
                      lower.endswith(".tar.bz2")
                      or
                      lower.endswith(".tar.xz")

                  )

                  if not archive:
                      continue

                  if PREFIX.lower() not in lower:
                      continue

                  found[message.id] = {

                      "message_id":
                          message.id,

                      "name":
                          name,

                      "size":
                          int(message.file.size),

                      "volume":
                          volume_number(name),

                      "base":
                          normalize(name)

                  }

              await client.disconnect()

              if not found:

                  raise RuntimeError(
                      "No matching Telegram files found."
                  )

              volumes = list(
                  found.values()
              )

              volumes.sort(
                  key=lambda x: (
                      x["base"],
                      x["volume"],
                      x["message_id"]
                  )
              )

              # Group by archive base name.

              groups = {}

              for item in volumes:

                  groups.setdefault(
                      item["base"],
                      []
                  ).append(item)

              # Select group matching requested prefix.

              selected = []

              for base, items in groups.items():

                  if PREFIX.lower() in base:

                      selected.extend(items)

              if not selected:

                  raise RuntimeError(
                      "No matching archive group."
                  )

              selected.sort(
                  key=lambda x: (
                      x["volume"],
                      x["message_id"]
                  )
              )

              # Remove duplicate Telegram messages
              # representing the same volume.

              unique = {}

              for item in selected:

                  key = (
                      item["base"],
                      item["volume"]
                  )

                  if key not in unique:

                      unique[key] = item

                  else:

                      # Prefer the larger file if duplicate
                      # metadata appears.

                      old = unique[key]

                      if item["size"] > old["size"]:

                          unique[key] = item

              selected = list(
                  unique.values()
              )

              selected.sort(
                  key=lambda x: x["volume"]
              )

              # Check volume sequence.

              volumes = [
                  x["volume"]
                  for x in selected
              ]

              print(
                  "Detected volumes:",
                  volumes
              )

              if len(volumes) > 1:

                  expected = list(
                      range(
                          min(volumes),
                          max(volumes) + 1
                      )
                  )

                  missing = [
                      x
                      for x in expected
                      if x not in volumes
                  ]

                  if missing:

                      raise RuntimeError(

                          "Missing archive volumes: "
                          +
                          ", ".join(
                              str(x)
                              for x in missing
                          )

                      )

              with open(
                  "archives.json",
                  "w"
              ) as f:

                  json.dump(
                      selected,
                      f,
                      indent=2,
                      sort_keys=True
                  )

              print(
                  json.dumps(
                      selected,
                      indent=2
                  )
              )


          asyncio.run(main())

          PY

          python3 discover.py

      - name: Generate immutable archive fingerprint
        id: fingerprint
        run: |

          python3 - <<'PY'

          import hashlib
          import json

          with open("archives.json", "rb") as f:
              data = f.read()

          digest = hashlib.sha256(
              data
          ).hexdigest()

          print(
              "fingerprint=" + digest
          )

          with open(
              "fingerprint.txt",
              "w"
          ) as f:

              f.write(digest)

          PY

          echo "fingerprint=$(cat fingerprint.txt)" \
            >> "$GITHUB_OUTPUT"

      - name: Upload discovery metadata
        uses: actions/upload-artifact@v4
        with:
          name: telegram-discovery
          path: |
            archives.json
            fingerprint.txt
          retention-days: 7


  # ============================================================
  # JOB 2 — DOWNLOAD
  # ============================================================

  download:

    needs: discover

    runs-on: ubuntu-latest

    outputs:
      cache_key: ${{ steps.cache_key.outputs.key }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download discovery metadata
        uses: actions/download-artifact@v4
        with:
          name: telegram-discovery

      - name: Generate cache key
        id: cache_key
        run: |

          KEY="telegram-3d-${CHANNEL}-${{ needs.discover.outputs.fingerprint }}"

          echo "key=$KEY" \
            >> "$GITHUB_OUTPUT"

          echo "$KEY"

      # --------------------------------------------------------
      # IMPORTANT:
      # The archive is cached using the Telegram metadata
      # fingerprint.
      #
      # Same files => same cache key => no new Telegram download.
      # --------------------------------------------------------

      - name: Restore archive cache
        id: archive-cache
        uses: actions/cache@v4
        with:
          path: telegram_cache
          key: ${{ steps.cache_key.outputs.key }}

      - name: Install Telethon
        if: steps.archive-cache.outputs.cache-hit != 'true' || inputs.force_download == true
        run: |

          python3 -m pip install --upgrade pip
          python3 -m pip install telethon

      - name: Restore Telegram session
        if: steps.archive-cache.outputs.cache-hit != 'true' || inputs.force_download == true
        env:
          TELEGRAM_SESSION_B64: ${{ secrets.TELEGRAM_SESSION_B64 }}
        run: |

          mkdir -p secrets

          printf '%s' "$TELEGRAM_SESSION_B64" \
            | base64 -d \
            > secrets/telegram_session.session

          chmod 600 secrets/telegram_session.session

      - name: Download multipart archives
        if: steps.archive-cache.outputs.cache-hit != 'true' || inputs.force_download == true
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}

        run: |

          mkdir -p telegram_cache
          mkdir -p telegram_partial

          cat > download.py <<'PY'

          import os
          import json
          import asyncio

          from pathlib import Path

          from telethon import TelegramClient


          API_ID = int(
              os.environ["TELEGRAM_API_ID"]
          )

          API_HASH = os.environ[
              "TELEGRAM_API_HASH"
          ]

          CHANNEL = os.environ[
              "CHANNEL"
          ]

          CHUNK_SIZE = 8 * 1024 * 1024

          MAX_RETRIES = 12


          async def download_one(
              client,
              item
          ):

              name = item["name"]

              expected = int(
                  item["size"]
              )

              final = (
                  Path("telegram_cache")
                  / name
              )

              partial = (
                  Path("telegram_partial")
                  / (name + ".part")
              )

              if final.exists():

                  if (
                      final.stat().st_size
                      == expected
                  ):

                      print(
                          "Already complete:",
                          name
                      )

                      return

                  print(
                      "Invalid cached file:",
                      name
                  )

                  final.unlink()

              for attempt in range(
                  1,
                  MAX_RETRIES + 1
              ):

                  try:

                      current = (

                          partial.stat().st_size

                          if partial.exists()

                          else 0

                      )

                      print()
                      print(
                          "================================"
                      )

                      print(
                          f"Downloading: {name}"
                      )

                      print(
                          f"Attempt: "
                          f"{attempt}/{MAX_RETRIES}"
                      )

                      print(
                          f"Resume at: "
                          f"{current / 1024**3:.3f} GiB"
                      )

                      message = (
                          await client.get_messages(
                              CHANNEL,
                              ids=item[
                                  "message_id"
                              ]
                          )
                      )

                      if not message:

                          raise RuntimeError(
                              "Telegram message disappeared."
                          )

                      with open(
                          partial,
                          "ab"
                      ) as f:

                          async for chunk in client.iter_download(

                              message.media,

                              offset=current,

                              request_size=CHUNK_SIZE

                          ):

                              f.write(chunk)

                              f.flush()

                              current += len(chunk)

                              if current % (
                                  256 * 1024 * 1024
                              ) < CHUNK_SIZE:

                                  print(

                                      f"{current / 1024**3:.3f}"
                                      f" / "
                                      f"{expected / 1024**3:.3f}"
                                      f" GiB"

                                  )

                      final_size = (
                          partial.stat().st_size
                      )

                      if final_size != expected:

                          raise RuntimeError(

                              f"Size mismatch: "
                              f"{final_size} != "
                              f"{expected}"

                          )

                      os.replace(
                          partial,
                          final
                      )

                      print(
                          "COMPLETE:",
                          name
                      )

                      return

                  except Exception as exc:

                      print(
                          "DOWNLOAD ERROR:",
                          repr(exc)
                      )

                      if attempt >= MAX_RETRIES:

                          raise

                      delay = min(
                          300,
                          15 * attempt
                      )

                      print(
                          f"Retrying in "
                          f"{delay}s..."
                      )

                      await asyncio.sleep(
                          delay
                      )


          async def main():

              client = TelegramClient(

                  "secrets/telegram_session",

                  API_ID,

                  API_HASH

              )

              await client.start()

              with open(
                  "archives.json"
              ) as f:

                  archives = json.load(f)

              for item in archives:

                  await download_one(
                      client,
                      item
                  )

              await client.disconnect()


          asyncio.run(main())

          PY

          python3 download.py

      - name: Validate downloaded volumes
        run: |

          python3 - <<'PY'

          import json
          from pathlib import Path

          with open(
              "archives.json"
          ) as f:

              archives = json.load(f)

          root = Path(
              "telegram_cache"
          )

          for item in archives:

              path = root / item["name"]

              if not path.exists():

                  raise RuntimeError(
                      f"Missing: {path}"
                  )

              actual = path.stat().st_size

              expected = int(
                  item["size"]
              )

              if actual != expected:

                  raise RuntimeError(

                      f"Size mismatch for "
                      f"{path}: "
                      f"{actual} != "
                      f"{expected}"

                  )

              print(
                  "OK:",
                  path
              )

          PY

      # The cache is saved automatically by actions/cache
      # when this job completes successfully.


  # ============================================================
  # JOB 3 — VERIFY + EXTRACT
  # ============================================================

  extract:

    needs:
      - discover
      - download

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download discovery
        uses: actions/download-artifact@v4
        with:
          name: telegram-discovery

      - name: Restore downloaded Telegram archive
        uses: actions/cache@v4
        with:
          path: telegram_cache
          key: telegram-3d-${{ env.CHANNEL }}-${{ needs.discover.outputs.fingerprint }}
          fail-on-cache-miss: true

      - name: Install archive tools
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            p7zip-full \
            p7zip-rar \
            unrar \
            unzip \
            jq \
            file \
            tree

      - name: Test real archives only
        run: |

          set -e

          python3 - <<'PY'

          import json
          import subprocess
          from pathlib import Path

          with open(
              "archives.json"
          ) as f:

              archives = json.load(f)

          root = Path(
              "telegram_cache"
          )

          for item in archives:

              archive = (
                  root /
                  item["name"]
              )

              print()
              print(
                  "=" * 70
              )

              print(
                  "Testing:",
                  archive
              )

              print(
                  "=" * 70
              )

              subprocess.run(
                  [
                      "7z",
                      "t",
                      str(archive),
                      "-y"
                  ],
                  check=True
              )

          PY

      - name: Detect multipart archive
        run: |

          python3 - <<'PY'

          import json

          with open(
              "archives.json"
          ) as f:

              archives = json.load(f)

          print(
              "Archive volumes:"
          )

          for item in archives:

              print(
                  f"  part {item['volume']}: "
                  f"{item['name']}"
              )

          if len(archives) > 1:

              print()
              print(
                  "MULTIVOLUME ARCHIVE DETECTED"
              )

              print(
                  "All volumes are present."
              )

          PY

      - name: Extract root archive
        run: |

          set -e

          mkdir -p extracted

          FIRST="$(
            python3 - <<'PY'
          import json

          with open("archives.json") as f:
              data = json.load(f)

          data.sort(
              key=lambda x: x["volume"]
          )

          print(
              data[0]["name"]
          )
          PY
          )"

          echo "Primary volume:"
          echo "$FIRST"

          7z x \
            "telegram_cache/$FIRST" \
            "-oextracted" \
            -y \
            -aoa

      # ========================================================
      # NESTED ARCHIVE EXTRACTION
      # ========================================================

      - name: Recursive extraction up to 10 levels
        env:
          MAX_ARCHIVE_DEPTH: ${{ env.MAX_ARCHIVE_DEPTH }}

        run: |

          cat > recursive_extract.py <<'PY'

          import os
          import json
          import subprocess

          from pathlib import Path


          ROOT = Path(
              "extracted"
          ).resolve()

          MAX_DEPTH = int(
              os.environ.get(
                  "MAX_ARCHIVE_DEPTH",
                  "10"
              )
          )


          EXTENSIONS = (

              ".zip",
              ".rar",
              ".7z",

              ".tar",
              ".tar.gz",
              ".tgz",

              ".tar.bz2",
              ".tbz2",

              ".tar.xz",
              ".txz"

          )


          def is_archive(path):

              name = path.name.lower()

              return any(
                  name.endswith(x)
                  for x in EXTENSIONS
              )


          def safe_path(path):

              resolved = path.resolve()

              return (

                  resolved == ROOT

                  or

                  str(resolved).startswith(
                      str(ROOT) + os.sep
                  )

              )


          processed = set()

          log = []


          for depth in range(
              1,
              MAX_DEPTH + 1
          ):

              candidates = []

              for path in ROOT.rglob("*"):

                  if not path.is_file():
                      continue

                  if not is_archive(path):
                      continue

                  key = str(
                      path.resolve()
                  )

                  if key in processed:
                      continue

                  if not safe_path(path):

                      raise RuntimeError(
                          f"Unsafe archive path: "
                          f"{path}"
                      )

                  candidates.append(path)

              if not candidates:

                  print(
                      "No more nested archives."
                  )

                  break

              print()
              print(
                  f"========== DEPTH {depth} =========="
              )

              for archive in candidates:

                  key = str(
                      archive.resolve()
                  )

                  processed.add(key)

                  destination = (
                      archive.parent
                      /
                      (
                          archive.name
                          + ".extracted"
                      )
                  )

                  destination.mkdir(
                      parents=True,
                      exist_ok=True
                  )

                  print(
                      "Extracting:",
                      archive
                  )

                  subprocess.run(

                      [
                          "7z",
                          "x",
                          str(archive),
                          f"-o{destination}",
                          "-y",
                          "-aoa"
                      ],

                      check=True

                  )

                  log.append({

                      "depth":
                          depth,

                      "archive":
                          str(archive),

                      "destination":
                          str(destination)

                  })


          with open(
              "extraction-log.json",
              "w"
          ) as f:

              json.dump(
                  log,
                  f,
                  indent=2
              )

          PY

          python3 recursive_extract.py


  # ============================================================
  # JOB 4 — ANALYSIS
  # ============================================================

  analyze:

    needs:
      - discover
      - extract

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download extracted workspace
        uses: actions/upload-artifact@v4
        with:
          name: extraction-state
          path: |
            extracted
            extraction-log.json
          retention-days: 7
