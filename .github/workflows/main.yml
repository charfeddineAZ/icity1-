name: Telegram 3D Import to GitLab

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Telegram channel username (بدون @)"
        required: true
        default: "svalkacg"

      message_id:
        description: "Telegram message ID"
        required: true
        default: "3875"

      prefix:
        description: "Archive group prefix"
        required: true
        default: "iCity Cyberpunk"

      max_depth:
        description: "أقصى عمق للاستخراج (0 = غير محدود)"
        required: true
        default: "100"

      force_download:
        description: "تجاهل الكاش وإعادة التحميل"
        required: true
        type: boolean
        default: false

      delete_archives_after_upload:
        description: "حذف الأرشيفات الأصلية بعد رفعها إلى GitLab"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: telegram-3d-import-${{ inputs.channel }}-${{ inputs.message_id }}-${{ inputs.prefix }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:

  # ============================================================
  # JOB 0 — PREFLIGHT
  # ============================================================
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate mandatory secrets
        env:
          TELEGRAM_SESSION_B64: ${{ secrets.TELEGRAM_SESSION_B64 }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPO_URL: ${{ secrets.GITLAB_REPO_URL }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_SESSION_B64" || { echo "❌ TELEGRAM_SESSION_B64 مفقود"; exit 1; }
          test -n "$TELEGRAM_API_ID" || { echo "❌ TELEGRAM_API_ID مفقود"; exit 1; }
          test -n "$TELEGRAM_API_HASH" || { echo "❌ TELEGRAM_API_HASH مفقود"; exit 1; }
          test -n "$GITLAB_TOKEN" || { echo "❌ GITLAB_TOKEN مفقود"; exit 1; }
          test -n "$GITLAB_REPO_URL" || { echo "❌ GITLAB_REPO_URL مفقود"; exit 1; }

          DECODED_SIZE=$(printf '%s' "$TELEGRAM_SESSION_B64" | base64 -d 2>/dev/null | wc -c)
          if [ "$DECODED_SIZE" -lt 10 ]; then
            echo "❌ TELEGRAM_SESSION_B64 غير صالح"
            exit 1
          fi

          # فحص صيغة رابط المستودع
          if [[ ! "$GITLAB_REPO_URL" =~ ^https?:// ]]; then
            echo "❌ GITLAB_REPO_URL يجب أن يبدأ بـ http:// أو https://"
            exit 1
          fi

          echo "✅ جميع الأسرار الإلزامية موجودة وصالحة"

      - name: Validate numeric inputs
        run: |
          set -euo pipefail
          if ! [[ "${{ inputs.message_id }}" =~ ^[0-9]+$ ]]; then
            echo "❌ message_id يجب أن يكون رقمًا صحيحًا"
            exit 1
          fi
          if ! [[ "${{ inputs.max_depth }}" =~ ^[0-9]+$ ]]; then
            echo "❌ max_depth يجب أن يكون عددًا صحيحًا (0 = غير محدود)"
            exit 1
          fi
          echo "✅ المدخلات الرقمية صالحة"


  # ============================================================
  # JOB 1 — DISCOVERY
  # ============================================================
  discover:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
      channel: ${{ steps.validate.outputs.channel }}
      message_id: ${{ steps.validate.outputs.message_id }}
      prefix: ${{ steps.validate.outputs.prefix }}
      max_depth: ${{ steps.validate.outputs.max_depth }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate and clean inputs
        id: validate
        run: |
          set -euo pipefail
          CLEAN_CHANNEL="$(printf '%s' "${{ inputs.channel }}" | tr -d '@' | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9_')"
          if [ -z "$CLEAN_CHANNEL" ]; then
            echo "❌ اسم القناة غير صالح"
            exit 1
          fi
          echo "CHANNEL=$CLEAN_CHANNEL" >> "$GITHUB_ENV"
          echo "channel=$CLEAN_CHANNEL" >> "$GITHUB_OUTPUT"
          echo "MESSAGE_ID=${{ inputs.message_id }}" >> "$GITHUB_ENV"
          echo "message_id=${{ inputs.message_id }}" >> "$GITHUB_OUTPUT"

          DEPTH="${{ inputs.max_depth }}"
          if [ "$DEPTH" == "0" ]; then
            DEPTH="999999"
          fi
          echo "MAX_ARCHIVE_DEPTH=$DEPTH" >> "$GITHUB_ENV"
          echo "max_depth=$DEPTH" >> "$GITHUB_OUTPUT"

          PREFIX_CLEAN="$(printf '%s' "${{ inputs.prefix }}" | tr -d '\n\r')"
          echo "ARCHIVE_PREFIX=$PREFIX_CLEAN" >> "$GITHUB_ENV"
          echo "prefix=$PREFIX_CLEAN" >> "$GITHUB_OUTPUT"

      - name: Install Python (with retry)
        run: |
          set -euo pipefail
          retry() {
            local n=1
            local max=3
            until "$@"; do
              if [ $n -ge $max ]; then return 1; fi
              echo "⚠️ إعادة المحاولة $n/$max: $*"
              n=$((n+1))
              sleep 5
            done
          }
          retry python3 -m pip install --upgrade pip
          retry python3 -m pip install telethon

      - name: Restore Telegram session
        env:
          TELEGRAM_SESSION_B64: ${{ secrets.TELEGRAM_SESSION_B64 }}
        run: |
          set -euo pipefail
          mkdir -p secrets
          printf '%s' "$TELEGRAM_SESSION_B64" | base64 -d > secrets/telegram_session.session
          chmod 600 secrets/telegram_session.session

      - name: Discover archive volumes
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -euo pipefail
          cat > discover.py <<'PY'
          import os
          import re
          import json
          import asyncio
          import sys

          from telethon import TelegramClient, errors

          API_ID = int(os.environ["TELEGRAM_API_ID"])
          API_HASH = os.environ["TELEGRAM_API_HASH"]
          CHANNEL = os.environ["CHANNEL"].lstrip('@')
          MESSAGE_ID = int(os.environ["MESSAGE_ID"])
          PREFIX = os.environ["ARCHIVE_PREFIX"].lower()

          ARCHIVE_EXTENSIONS = (
              '.rar', '.zip', '.7z',
              '.tar', '.tar.gz', '.tgz',
              '.tar.bz2', '.tbz2', '.tar.xz', '.txz'
          )

          def normalize(name):
              name = name.lower()
              name = re.sub(r'\.part\d+\.(?:rar|zip|7z|tar|tar\.gz|tgz|tar\.bz2|tbz2|tar\.xz|txz)$', '', name, flags=re.I)
              name = re.sub(r'\.r\d+$', '', name, flags=re.I)
              name = re.sub(r'\.\d{3}$', '', name, flags=re.I)
              return name

          def volume_number(name):
              m = re.search(r'\.part(\d+)\.(?:rar|zip|7z|tar|tar\.gz|tgz|tar\.bz2|tbz2|tar\.xz|txz)$', name, re.I)
              if m:
                  return int(m.group(1))
              m = re.search(r'\.r(\d+)$', name, re.I)
              if m:
                  return int(m.group(1))
              m = re.search(r'\.(\d{3})$', name, re.I)
              if m:
                  return int(m.group(1))
              return 1

          async def main():
              client = TelegramClient("secrets/telegram_session", API_ID, API_HASH)
              try:
                  await client.start()
              except Exception as e:
                  print(f"❌ فشل الاتصال بتيليجرام: {e!r}")
                  sys.exit(1)

              found = {}
              start = max(1, MESSAGE_ID - 3000)
              end = MESSAGE_ID + 3000

              try:
                  async for message in client.iter_messages(CHANNEL, min_id=start, max_id=end, limit=10000):
                      if not message.file:
                          continue
                      name = message.file.name or ""
                      if not name:
                          continue
                      lower = name.lower()
                      if not any(lower.endswith(ext) for ext in ARCHIVE_EXTENSIONS):
                          continue
                      if PREFIX not in lower:
                          continue
                      found[message.id] = {
                          "message_id": message.id,
                          "name": name,
                          "size": int(message.file.size),
                          "volume": volume_number(name),
                          "base": normalize(name)
                      }
              except errors.FloodWaitError as e:
                  print(f"❌ FloodWaitError: {e.seconds} ثانية")
                  sys.exit(1)
              except Exception as e:
                  print(f"❌ خطأ أثناء جلب الرسائل: {e!r}")
                  sys.exit(1)
              finally:
                  if client.is_connected():
                      await client.disconnect()

              if not found:
                  raise RuntimeError("No matching Telegram files found.")

              volumes = list(found.values())
              volumes.sort(key=lambda x: (x["base"], x["volume"], x["message_id"]))

              groups = {}
              for item in volumes:
                  groups.setdefault(item["base"], []).append(item)

              candidates = [items for base, items in groups.items() if PREFIX in base]
              if not candidates:
                  raise RuntimeError("No matching archive group.")

              selected = max(candidates, key=lambda items: (len(items), sum(x["size"] for x in items)))
              selected.sort(key=lambda x: (x["volume"], x["message_id"]))

              unique = {}
              for item in selected:
                  key = (item["base"], item["volume"])
                  if key not in unique or item["size"] > unique[key]["size"]:
                      unique[key] = item

              selected = list(unique.values())
              selected.sort(key=lambda x: (x["base"], x["volume"], x["message_id"]))

              vols = [x["volume"] for x in selected]
              print("Detected volumes:", vols)

              if len(vols) > 1:
                  expected = list(range(min(vols), max(vols)+1))
                  missing = [v for v in expected if v not in vols]
                  if missing:
                      raise RuntimeError("Missing archive volumes: " + ", ".join(str(x) for x in missing))

              with open("archives.json", "w") as f:
                  json.dump(selected, f, indent=2, sort_keys=True)

              print(json.dumps(selected, indent=2))

          if __name__ == "__main__":
              asyncio.run(main())
          PY
          python3 discover.py

      - name: Validate archives.json structure
        run: |
          python3 - <<'PY'
          import json, sys
          with open("archives.json") as f:
              data = json.load(f)
          if not isinstance(data, list) or len(data) == 0:
              print("❌ archives.json غير صالح")
              sys.exit(1)
          required = {"message_id", "name", "size", "volume", "base"}
          for item in data:
              if not required.issubset(item.keys()):
                  print(f"❌ عنصر ناقص: {item}")
                  sys.exit(1)
          print("✅ archives.json سليم")
          PY

      - name: Generate fingerprint
        id: fingerprint
        run: |
          python3 - <<'PY'
          import hashlib
          with open("archives.json", "rb") as f:
              data = f.read()
          digest = hashlib.sha256(data).hexdigest()
          print("fingerprint=" + digest)
          with open("fingerprint.txt", "w") as f:
              f.write(digest)
          PY
          echo "fingerprint=$(cat fingerprint.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload discovery metadata
        uses: actions/upload-artifact@v4
        with:
          name: telegram-discovery
          path: |
            archives.json
            fingerprint.txt
          retention-days: 7


  # ============================================================
  # JOB 2 — DOWNLOAD
  # ============================================================
  download:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 360

    outputs:
      cache_key: ${{ steps.cache_key.outputs.save_key }}

    env:
      CHANNEL: ${{ needs.discover.outputs.channel }}
      MESSAGE_ID: ${{ needs.discover.outputs.message_id }}
      ARCHIVE_PREFIX: ${{ needs.discover.outputs.prefix }}
      MAX_ARCHIVE_DEPTH: ${{ needs.discover.outputs.max_depth }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download discovery metadata
        uses: actions/download-artifact@v4
        with:
          name: telegram-discovery

      - name: Validate archives.json
        run: |
          python3 - <<'PY'
          import json, sys
          with open("archives.json") as f:
              data = json.load(f)
          if not isinstance(data, list) or len(data) == 0:
              print("❌ archives.json غير صالح")
              sys.exit(1)
          print("✅ archives.json سليم")
          PY

      - name: Generate cache key
        id: cache_key
        run: |
          BASE="telegram-3d-${CHANNEL}-${{ needs.discover.outputs.fingerprint }}"
          if [ "${{ inputs.force_download }}" == "true" ]; then
            SAVE_KEY="${BASE}-force-${GITHUB_RUN_ID}"
          else
            SAVE_KEY="${BASE}"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "save_key=$SAVE_KEY" >> "$GITHUB_OUTPUT"

      - name: Restore archive cache
        if: inputs.force_download == false
        id: archive-cache
        uses: actions/cache/restore@v4
        with:
          path: telegram_cache
          key: ${{ steps.cache_key.outputs.base }}
          restore-keys: |
            ${{ steps.cache_key.outputs.base }}-

      - name: Install Telethon (retry)
        if: steps.archive-cache.outputs.cache-hit != 'true' || inputs.force_download == true
        run: |
          set -euo pipefail
          retry() {
            local n=1
            local max=3
            until "$@"; do
              if [ $n -ge $max ]; then return 1; fi
              echo "⚠️ إعادة المحاولة $n/$max: $*"
              n=$((n+1))
              sleep 5
            done
          }
          retry python3 -m pip install --upgrade pip
          retry python3 -m pip install telethon

      - name: Restore Telegram session
        if: steps.archive-cache.outputs.cache-hit != 'true' || inputs.force_download == true
        env:
          TELEGRAM_SESSION_B64: ${{ secrets.TELEGRAM_SESSION_B64 }}
        run: |
          mkdir -p secrets
          printf '%s' "$TELEGRAM_SESSION_B64" | base64 -d > secrets/telegram_session.session
          chmod 600 secrets/telegram_session.session

      - name: Download multipart archives
        if: steps.archive-cache.outputs.cache-hit != 'true' || inputs.force_download == true
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -euo pipefail
          mkdir -p telegram_cache telegram_partial
          cat > download.py <<'PY'
          import os
          import json
          import asyncio
          import shutil
          import random
          from pathlib import Path

          from telethon import TelegramClient, errors

          API_ID = int(os.environ["TELEGRAM_API_ID"])
          API_HASH = os.environ["TELEGRAM_API_HASH"]
          CHANNEL = os.environ["CHANNEL"]
          CHUNK_SIZE = 8 * 1024 * 1024
          MAX_RETRIES = 12

          async def download_one(client, item):
              name = item["name"]
              expected = int(item["size"])
              final = Path("telegram_cache") / name
              partial = Path("telegram_partial") / (name + ".part")

              if final.exists() and final.stat().st_size == expected:
                  print(f"Already complete: {name}")
                  return

              if final.exists():
                  print(f"Invalid cached file, removing: {name}")
                  final.unlink()

              for attempt in range(1, MAX_RETRIES + 1):
                  try:
                      if partial.exists() and partial.stat().st_size > expected:
                          partial.unlink()

                      current = partial.stat().st_size if partial.exists() else 0
                      print(f"\nDownloading: {name} (Attempt {attempt}/{MAX_RETRIES})")

                      message = await client.get_messages(CHANNEL, ids=item["message_id"])
                      if not message:
                          raise RuntimeError("Telegram message disappeared.")

                      with open(partial, "ab") as f:
                          async for chunk in client.iter_download(message.media, offset=current, request_size=CHUNK_SIZE):
                              f.write(chunk)
                              f.flush()
                              current += len(chunk)
                              if current % (256 * 1024 * 1024) < CHUNK_SIZE:
                                  print(f"{current/1024**3:.3f} / {expected/1024**3:.3f} GiB")

                      if partial.stat().st_size != expected:
                          raise RuntimeError(f"Size mismatch: {partial.stat().st_size} != {expected}")

                      os.replace(partial, final)
                      print(f"COMPLETE: {name}")
                      return

                  except errors.FloodWaitError as e:
                      print(f"⚠️ FloodWaitError: {e.seconds} ثانية")
                      if attempt >= MAX_RETRIES:
                          raise
                      await asyncio.sleep(min(e.seconds + random.uniform(1, 5), 300))
                  except Exception as exc:
                      print(f"DOWNLOAD ERROR: {exc!r}")
                      if attempt >= MAX_RETRIES:
                          raise
                      if partial.exists() and partial.stat().st_size >= expected:
                          partial.unlink()
                      delay = min(300, 15 * attempt) + random.uniform(0, 5)
                      print(f"Retrying in {delay:.1f}s...")
                      await asyncio.sleep(delay)

          async def main():
              client = TelegramClient("secrets/telegram_session", API_ID, API_HASH)
              try:
                  await client.start()
              except Exception as e:
                  print(f"❌ فشل الاتصال بتيليجرام: {e!r}")
                  raise
              try:
                  with open("archives.json") as f:
                      archives = json.load(f)
                  for item in archives:
                      await download_one(client, item)
              finally:
                  if client.is_connected():
                      await client.disconnect()

          if __name__ == "__main__":
              asyncio.run(main())
          PY
          python3 download.py

      - name: Validate downloaded volumes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          with open("archives.json") as f:
              archives = json.load(f)
          root = Path("telegram_cache")
          for item in archives:
              path = root / item["name"]
              if not path.exists():
                  raise RuntimeError(f"Missing: {path}")
              actual = path.stat().st_size
              expected = int(item["size"])
              if actual != expected:
                  raise RuntimeError(f"Size mismatch: {actual} != {expected}")
              print(f"OK: {path}")
          PY

      - name: Save archive cache
        if: steps.archive-cache.outputs.cache-hit != 'true' || inputs.force_download == true
        uses: actions/cache/save@v4
        with:
          path: telegram_cache
          key: ${{ steps.cache_key.outputs.save_key }}


  # ============================================================
  # JOB 3 — EXTRACT & PUSH TO GITLAB
  # ============================================================
  extract:
    needs:
      - discover
      - download
    runs-on: ubuntu-latest
    timeout-minutes: 720

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download discovery metadata
        uses: actions/download-artifact@v4
        with:
          name: telegram-discovery

      - name: Validate archives.json
        run: |
          python3 - <<'PY'
          import json, sys
          with open("archives.json") as f:
              data = json.load(f)
          if not isinstance(data, list) or len(data) == 0:
              print("❌ archives.json غير صالح")
              sys.exit(1)
          print("✅ archives.json سليم")
          PY

      - name: Restore downloaded archive cache
        uses: actions/cache/restore@v4
        with:
          path: telegram_cache
          key: ${{ needs.download.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Install archive tools (resilient)
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          echo "🔄 محاولة تحديث الفهارس (مع مهلات قصيرة)..."
          sudo apt-get update -o Acquire::http::Timeout=15 \
                               -o Acquire::https::Timeout=15 \
                               -o Acquire::Retries=2 \
                               -o Acquire::ForceIPv4=true \
            || echo "⚠️ فشل apt-get update، سنحاول التثبيت مباشرة"

          echo "📦 تثبيت الأدوات..."
          sudo apt-get install -y --no-install-recommends \
            p7zip-full p7zip-rar unrar unzip jq file tree \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o Acquire::Retries=3 \
            -o Acquire::ForceIPv4=true \
            || {
              echo "❌ فشل التثبيت من المستودعات، محاولة بديلة..."
              sudo apt-get install -y p7zip-full unrar unzip
            }

          echo "✅ تم تثبيت أدوات الأرشيف"

      - name: Test real archives only (non-blocking)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          with open("archives.json") as f:
              archives = json.load(f)

          root = Path("telegram_cache")
          for item in archives:
              archive = root / item["name"]
              print(f"\nTesting: {archive}")
              result = subprocess.run(
                  ["timeout", "30m", "7z", "t", str(archive), "-y"],
                  capture_output=True,
                  text=True
              )
              if result.returncode != 0:
                  print(f"⚠️ فشل اختبار {archive} (كود {result.returncode})، سيتم المتابعة")
          PY

      - name: Extract root archive
        run: |
          set -euo pipefail
          mkdir -p extracted

          FIRST=$(python3 - <<'PY'
          import json
          with open("archives.json") as f:
              data = json.load(f)
          data.sort(key=lambda x: x["volume"])
          print(data[0]["name"])
          PY
          )

          echo "Primary volume: $FIRST"
          timeout 60m 7z x "telegram_cache/$FIRST" -oextracted -y -aoa

      - name: Recursive extraction (بدون حدود للحجم/العدد)
        env:
          MAX_ARCHIVE_DEPTH: ${{ needs.discover.outputs.max_depth }}
        run: |
          set -euo pipefail
          cat > recursive_extract.py <<'PY'
          import os
          import re
          import json
          import subprocess
          import sys
          from pathlib import Path

          ROOT = Path("extracted").resolve()
          MAX_DEPTH = int(os.environ.get("MAX_ARCHIVE_DEPTH", "999999"))

          ARCHIVE_EXTENSIONS = (
              ".zip", ".rar", ".7z",
              ".tar", ".tar.gz", ".tgz",
              ".tar.bz2", ".tbz2",
              ".tar.xz", ".txz"
          )

          def is_archive_file(path):
              return any(path.name.lower().endswith(ext) for ext in ARCHIVE_EXTENSIONS)

          def multipart_key(name):
              lower = name.lower()
              m = re.match(r'^(.+)\.part(\d+)\.(zip|rar|7z|tar|tar\.gz|tgz|tar\.bz2|tbz2|tar\.xz|txz)$', lower)
              if m:
                  return (m.group(1), int(m.group(2)))
              m = re.match(r'^(.+\.(?:zip|rar|7z|tar|tar\.gz|tgz|tar\.bz2|tbz2|tar\.xz|txz))\.(\d{3})$', lower)
              if m:
                  return (m.group(1), int(m.group(2)))
              return None

          def safe_path(path, root=ROOT):
              resolved = path.resolve()
              return resolved == root or str(resolved).startswith(str(root) + os.sep)

          def check_archive_entries(archive_path):
              print(f"  فحص محتويات: {archive_path.name}")
              result = subprocess.run(
                  ["7z", "l", "-slt", str(archive_path)],
                  capture_output=True,
                  text=True,
                  timeout=60
              )
              if result.returncode != 0:
                  print("  ⚠️ تعذر فحص المحتويات")
              for line in result.stdout.splitlines():
                  if line.startswith("Path = "):
                      entry = line[len("Path = "):].strip()
                      if entry == archive_path.name or entry == str(archive_path) or entry.endswith('/' + archive_path.name):
                          continue
                      if entry.startswith("/") or entry.startswith("\\"):
                          print(f"  ⚠️ تم تجاهل مسار مطلق: {entry}")
                          continue
                      parts = entry.replace("\\", "/").split("/")
                      if any(p == ".." for p in parts):
                          raise RuntimeError(f"مسار خطير (..) ممنوع: {entry}")
              print("  ✅ اكتمل الفحص")

          def extract_one(archive_path, destination):
              destination.mkdir(parents=True, exist_ok=True)
              print(f"Extracting: {archive_path} -> {destination}")
              check_archive_entries(archive_path)
              result = subprocess.run(
                  ["timeout", "60m", "7z", "x", str(archive_path), f"-o{destination}", "-y", "-aoa"],
                  capture_output=True,
                  text=True
              )
              if result.returncode != 0:
                  print(f"⚠️ فشل استخراج {archive_path} (كود {result.returncode})")
                  raise RuntimeError(f"فشل استخراج {archive_path}")
              for p in destination.rglob("*"):
                  if p.is_symlink():
                      raise RuntimeError(f"روابط رمزية غير مسموحة: {p}")
                  if not safe_path(p):
                      raise RuntimeError(f"مسار غير آمن: {p}")

          processed = set()
          log = []

          for depth in range(1, MAX_DEPTH + 1):
              multipart_groups = {}
              singles = []

              for path in ROOT.rglob("*"):
                  if not path.is_file() or path.is_symlink():
                      continue
                  rpath = str(path.resolve())
                  if rpath in processed:
                      continue

                  key = multipart_key(path.name)
                  if key:
                      base, vol = key
                      multipart_groups.setdefault(base, []).append((vol, path))
                  elif is_archive_file(path):
                      singles.append(path)

              tasks = []

              for base, parts in multipart_groups.items():
                  if len(parts) < 2:
                      for _, p in parts:
                          singles.append(p)
                      continue

                  parts.sort(key=lambda x: x[0])
                  vols = [p[0] for p in parts]
                  expected = list(range(min(vols), max(vols)+1))
                  missing = [v for v in expected if v not in vols]
                  if missing:
                      raise RuntimeError(f"Missing multipart volumes for {base}: {missing}")

                  parent = parts[0][1].parent
                  if any(p.parent != parent for _, p in parts):
                      raise RuntimeError(f"Multipart parts for {base} not in same directory")

                  first_path = parts[0][1]
                  dest = first_path.parent / (first_path.name + ".extracted")
                  tasks.append((first_path, dest, [p for _, p in parts]))

              for p in singles:
                  dest = p.parent / (p.name + ".extracted")
                  tasks.append((p, dest, [p]))

              if not tasks:
                  print("No more nested archives.")
                  break

              print(f"\n========== DEPTH {depth} ==========")
              for archive_path, dest, part_paths in tasks:
                  if str(archive_path.resolve()) in processed:
                      continue

                  extract_one(archive_path, dest)

                  for p in part_paths:
                      processed.add(str(p.resolve()))

                  log.append({
                      "depth": depth,
                      "archive": str(archive_path),
                      "destination": str(dest)
                  })

          with open("extraction-log.json", "w") as f:
              json.dump(log, f, indent=2)
          PY
          python3 recursive_extract.py

      - name: Analyze 3D content
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          ROOT = Path("extracted")
          extensions = {
              ".obj", ".fbx", ".gltf", ".glb", ".stl", ".dae", ".3ds",
              ".blend", ".max", ".ma", ".mb", ".usd", ".usdz", ".abc",
              ".ply", ".wrl", ".x3d", ".3mf", ".amf"
          }
          stats = {}
          total_size = 0
          total_count = 0
          for ext in extensions:
              ext = ext.lower()
              files = [p for p in ROOT.rglob(f"*{ext}")]
              count = len(files)
              size = sum(p.stat().st_size for p in files)
              if count > 0:
                  stats[ext] = {"count": count, "size": size}
                  total_count += count
                  total_size += size

          report = {
              "total_3d_files": total_count,
              "total_3d_size": total_size,
              "by_extension": stats
          }
          with open("analysis.json", "w") as f:
              json.dump(report, f, indent=2)
          print(json.dumps(report, indent=2))
          PY

      - name: Push archives and extracted files to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPO_URL: ${{ secrets.GITLAB_REPO_URL }}
        run: |
          set -euo pipefail

          # إعداد بيانات الدخول
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # استنساخ المستودع
          CLEAN_URL="${GITLAB_REPO_URL/https:\/\//https:\/\/oauth2:${GITLAB_TOKEN}@}"
          CLEAN_URL="${CLEAN_URL/http:\/\//http:\/\/oauth2:${GITLAB_TOKEN}@}"
          git clone --depth 1 "$CLEAN_URL" gitlab_repo
          cd gitlab_repo

          # إنشاء مجلدات للحفظ
          mkdir -p archives extracted reports

          # نسخ الأرشيفات الأصلية
          if [ -d "../telegram_cache" ]; then
            cp -r ../telegram_cache/* archives/
          fi

          # نسخ الملفات المفكوكة
          if [ -d "../extracted" ]; then
            cp -r ../extracted/* extracted/
          fi

          # نسخ التقارير
          if [ -f "../extraction-log.json" ]; then
            cp ../extraction-log.json reports/
          fi
          if [ -f "../analysis.json" ]; then
            cp ../analysis.json reports/
          fi

          # إضافة الملفات وcommit وpush
          git add .
          git commit -m "Import ${CHANNEL} ${ARCHIVE_PREFIX} - $(date -u +%Y%m%d%H%M%S)" || echo "لا توجد تغييرات"
          git push origin HEAD:main || git push origin HEAD:master

          echo "✅ تم رفع جميع الملفات إلى GitLab"

      - name: Optional cleanup of original archives
        if: inputs.delete_archives_after_upload == true
        run: |
          echo "حذف الأرشيفات الأصلية من مساحة العمل..."
          rm -rf telegram_cache telegram_partial
          echo "تم الحذف"


  # ============================================================
  # JOB 4 — SUMMARY
  # ============================================================
  analyze:
    needs:
      - extract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print summary
        run: |
          echo "📊 انتهى سير العمل"
          echo "الحالة: ${{ needs.extract.result }}"
          echo "القناة: ${{ needs.discover.outputs.channel }}"
          echo "البادئة: ${{ needs.discover.outputs.prefix }}"
          echo "تم رفع الأرشيفات الأصلية والملفات المفكوكة إلى GitLab"


  # ============================================================
  # JOB 5 — NOTIFICATION
  # ============================================================
  notify:
    needs: [preflight, discover, download, extract, analyze]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send Telegram notification (optional)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ needs.extract.result }}
          CHANNEL: ${{ needs.discover.outputs.channel }}
          PREFIX: ${{ needs.discover.outputs.prefix }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets غير موجودة، تم تخطي الإشعار."
            exit 0
          fi

          STATUS_EMOJI="✅"
          if [ "$STATUS" != "success" ]; then STATUS_EMOJI="❌"; fi
          MESSAGE="${STATUS_EMOJI} اكتمل استيراد ${PREFIX} من ${CHANNEL} إلى GitLab (الأرشيفات والمفكوك)"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
               -d chat_id="${TELEGRAM_CHAT_ID}" \
               -d text="${MESSAGE}" || true
